<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>제품표시사항 검색</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --sub:#5b6475; --line:#e3e6eb; --accent:#c8102e; --accent-soft:#fdecef;
  --chip:#eef0f4; --frozen:#2563eb; --frozen-bg:#e8f0fe; --chill:#0f8a6a; --chill-bg:#e3f6f0; --room:#a16207; --room-bg:#fdf3dc;
  --warn:#b42318; --warn-bg:#fdecea; --muted:#8a92a3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* 잠금 화면 */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:100%;max-width:360px;text-align:center}
#lock h1{font-size:19px;margin:0 0 6px}
#lock p{color:var(--sub);margin:0 0 20px;font-size:13px}
#lock input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
#lock label{display:flex;gap:6px;align-items:center;justify-content:center;margin:12px 0;color:var(--sub);font-size:13px}
#lock button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#lockErr{color:var(--warn);font-size:13px;min-height:18px;margin-top:10px}

/* 본 화면 */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.top h1 b{color:var(--accent)}
.built{color:var(--muted);font-size:12px;margin-left:auto}
.searchrow{display:flex;gap:8px;padding-bottom:10px}
.searchrow select{border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;min-width:92px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;padding:11px 36px 11px 12px;border:1.5px solid var(--ink);border-radius:8px;font-size:15px}
.sbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
.filters{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;padding-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--sub)}
.filters select{border:1px solid var(--line);border-radius:7px;padding:6px 6px;background:#fff;font-size:13px;width:100%}
.filters select.on{border-color:var(--accent);background:var(--accent-soft)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.count{font-size:14px}.count b{font-size:17px}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink)}
.tip{color:var(--muted);font-size:12px}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#fafbfc;font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;
   position:sticky;top:var(--hh,0px);z-index:3;box-shadow:0 1px 0 var(--line)}
td.c-main{font-size:12px;color:var(--sub);max-width:280px;min-width:160px}
th.sorted::after{content:" ▲";font-size:9px}
th.sorted.desc::after{content:" ▼"}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafbff}
td.code{font-family:Consolas,monospace;font-weight:600;white-space:nowrap}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.nm2{color:var(--sub);font-size:12px;margin-top:2px}
.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--chip);color:var(--sub)}
.t-냉동{background:var(--frozen-bg);color:var(--frozen)}
.t-냉장{background:var(--chill-bg);color:var(--chill)}
.t-실온{background:var(--room-bg);color:var(--room)}
.st-생산중단{background:#f1f1f1;color:var(--muted);text-decoration:line-through}
.ls-없음{background:var(--warn-bg);color:var(--warn)}
.ls-해당없음{background:#f1f1f1;color:var(--muted)}
.ls-미정리{background:#fff;color:var(--muted);border:1px dashed var(--line)}
.t-저냉{background:var(--chill-bg);color:var(--chill)}
mark{background:#fff3a3;color:inherit;padding:0 1px;border-radius:2px}
.ing{color:var(--sub);font-size:12px;margin-top:3px;max-width:420px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* 상세 */
#dlg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;justify-content:flex-end;z-index:20}
#dlg .panel{background:var(--card);width:100%;max-width:640px;height:100%;overflow:auto;padding:22px 24px 40px}
#dlg .close{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--sub)}
#dlg h2{margin:0 0 4px;font-size:19px}
#dlg .meta{color:var(--sub);font-size:13px;margin-bottom:14px}
#dlg .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
#dlg h3{font-size:13px;color:var(--sub);margin:20px 0 6px;font-weight:600}
.lbl{width:100%;border:1.5px solid var(--ink);border-radius:0}
.lbl th{width:118px;background:#f4f5f7;color:var(--ink);cursor:default;font-size:12.5px;white-space:normal}
.lbl td{font-size:13px;white-space:pre-wrap;word-break:keep-all}
.memo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}

@media (max-width:900px){
  .filters{grid-template-columns:repeat(4,minmax(0,1fr))}
  .c-type,.c-fac,.c-life,.c-main{display:none}
}
@media (max-width:600px){
  header{position:static}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .searchrow{flex-wrap:wrap}.searchrow select{flex:1}
  .sbox{flex-basis:100%;order:-1}
  .c-ls,.c-wt,.c-st{display:none}
  .ing{display:none}
  .built{margin-left:0}
}
</style>
</head>
<body>

<div id="lock" class="hidden">
  <form id="lockForm" autocomplete="off">
    <h1>🔒 제품표시사항 검색</h1>
    <p>사내 전용 자료입니다. 비밀번호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autofocus>
    <label><input type="checkbox" id="remember"> 이 기기에서 기억하기</label>
    <button type="submit" id="unlockBtn">열기</button>
    <div id="lockErr"></div>
  </form>
</div>

<div id="app" class="hidden">
<header><div class="wrap">
  <div class="top"><h1><b>진주햄</b> 제품표시사항 검색</h1><span class="built" id="built"></span></div>
  <div class="searchrow">
    <select id="scope" title="검색 범위">
      <option value="all">전체</option>
      <option value="code">코드</option>
      <option value="name">제품명</option>
      <option value="ing">원재료</option>
    </select>
    <div class="sbox">
      <input id="q" type="search" placeholder="코드 · 제품명 · 원재료 · 500g · 270일 … (띄어쓰기 무시, 초성 ㅂㅇㅋ 가능)">
      <button id="qClear" title="지우기">×</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</div></header>

<main class="wrap">
  <div class="bar">
    <span class="count"><b id="cnt">0</b> / <span id="tot">0</span>개</span>
    <span class="tip">여러 단어는 모두 포함 · 앞에 <b>-</b>를 붙이면 제외 (예: 비엔나 -대두, 원재료 정보 없는 제품은 제외 결과에서 빠짐)</span>
    <span class="sp"></span>
    <button class="btn" id="reset">조건 초기화</button>
    <button class="btn" id="csv">CSV 다운로드</button>
    <button class="btn hidden" id="logout">잠그기</button>
  </div>
  <table>
    <thead><tr>
      <th data-k="code">코드</th>
      <th data-k="name">제품명</th>
      <th data-k="mainIng" class="c-main">주요 원재료</th>
      <th data-k="temp">품온</th>
      <th data-k="erpGroup" class="c-type">제품군류</th>
      <th data-k="weightG" class="c-wt num">중량</th>
      <th data-k="shelfLife" class="c-life num">소비기한</th>
      <th data-k="status" class="c-st">생산상태</th>
      <th data-k="labelStatus" class="c-ls">표시사항</th>
      <th data-k="factory" class="c-fac">공장</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty hidden">조건에 맞는 제품이 없습니다.</div>
  <div style="height:40px"></div>
</main>
</div>

<div id="dlg" class="hidden"><div class="panel" id="dlgBody"></div></div>

/* ---------- 잠금 해제 (AES-GCM + PBKDF2, 브라우저 Web Crypto) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYSTORE = 'labelsite_key_' + (DATA.enc ? DATA.enc.salt : '');
function store(k, v){ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

async function deriveRaw(pw){
  const e = DATA.enc;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(e.salt), iterations:e.iter}, base, 256));
}
async function decryptWith(raw){
  const e = DATA.enc;
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function boot(){
  if (DATA.plain){ start(JSON.parse(DATA.plain)); return; }
  if (!window.crypto || !crypto.subtle){ document.getElementById('lock').classList.remove('hidden');
    document.getElementById('lockErr').textContent = '이 브라우저에서는 열 수 없습니다. 크롬·엣지 최신 버전을 사용하세요.'; return; }
  const saved = load(KEYSTORE);
  if (saved){ try{ start(await decryptWith(b64(saved)), true); return; }catch(e){ store(KEYSTORE, null); } }
  document.getElementById('lock').classList.remove('hidden');
  document.getElementById('pw').focus();
}
document.getElementById('lockForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('lockErr'), btn = document.getElementById('unlockBtn');
  err.textContent = ''; btn.disabled = true; btn.textContent = '확인 중…';
  try{
    const raw = await deriveRaw(document.getElementById('pw').value);
    const data = await decryptWith(raw);
    if (document.getElementById('remember').checked) store(KEYSTORE, btoa(String.fromCharCode(...raw)));
    document.getElementById('lock').classList.add('hidden');
    start(data, true);
  }catch(e){ err.textContent = '비밀번호가 맞지 않습니다.'; }
  btn.disabled = false; btn.textContent = '열기';
});
document.getElementById('logout').onclick = () => { store(KEYSTORE, null); location.hash=''; location.reload(); };

/* ---------- 검색 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosung = s => [...s].map(c => { const n = c.charCodeAt(0) - 0xAC00; return (n >= 0 && n < 11172) ? CHO[Math.floor(n/588)] : c; }).join('');
const isCho = s => /^[ㄱ-ㅎ]+$/.test(s);
const norm = s => String(s||'').toLowerCase().replace(/[\s,·\/]+/g, '');
const fmtW = g => g==null ? '' : (g >= 1000 && g % 100 === 0 ? (g/1000).toLocaleString()+' kg' : g.toLocaleString()+' g');

function normToken(t){
  t = norm(t);
  let m = t.match(/^(\d+(?:\.\d+)?)kg$/); if (m) return Math.round(parseFloat(m[1])*1000)+'g';
  return t;
}

const EN_KO = [
  [/soy/i,'대두'], [/wheat/i,'밀'], [/milk|dairy/i,'우유'], [/\begg/i,'알류 계란 난류'], [/pork|\bpig/i,'돼지고기'],
  [/chicken/i,'닭고기'], [/beef/i,'쇠고기'], [/shrimp|prawn/i,'새우'], [/crab/i,'게'], [/squid/i,'오징어'],
  [/pollack|fish/i,'어육 생선 명태'], [/tomato/i,'토마토'], [/peanut/i,'땅콩'], [/sulfite|sulphite/i,'아황산류'],
  [/oyster/i,'굴 조개류'], [/buckwheat/i,'메밀'],
];
let ITEMS = [], sortK = 'code', sortDesc = false;
const FILTERS = [
  {k:'group',       label:'제품군'},
  {k:'temp',        label:'품온'},
  {k:'type',        label:'제품유형'},
  {k:'status',      label:'생산상태'},
  {k:'labelStatus', label:'표시사항 상태'},
  {k:'factory',     label:'공장구분'},
  {k:'weightG',     label:'중량', fmt:fmtW, num:true},
  {k:'shelfLife',   label:'소비기한', fmt:v => v==null?'':v+'일', num:true},
];

function start(data, locked){
  ITEMS = data.items.map(r => {
    const name = [r.labelName, r.erpName].join(' ');
    let ing  = [r.mainIng, r.ingredients, r.allergy].join(' ');
    // 수출용 영문 라벨: 영문 원재료·알레르기명에 국문을 붙여 한글로도 찾히게
    EN_KO.forEach(([re, ko]) => { if (re.test(ing)) ing += ' ' + ko; });
    const extra = [r.foodType, r.type, r.temp, r.storage, r.status, r.factory, r.labelStatus, r.group, r.erpGroup, r.content, r.pack,
                   r.shortName, r.supplier,
                   r.weightG!=null ? r.weightG+'g' : '', r.shelfLife!=null ? r.shelfLife+'일' : '', r.reportNo, r.maker].join(' ');
    return Object.assign(r, {
      _code: norm(r.code), _name: norm(name), _ing: norm(ing), _extra: norm(extra),
      _cho: norm(chosung(name)), _sortName: r.erpName || r.labelName
    });
  });
  document.getElementById('built').textContent = '자료 기준 ' + data.built + (DATA.plain ? ' · 미리보기(암호화 없음)' : '');
  document.getElementById('tot').textContent = ITEMS.length;
  if (locked) document.getElementById('logout').classList.remove('hidden');
  buildFilters(); readHash(); document.getElementById('app').classList.remove('hidden'); render();
  setHH(); window.addEventListener('resize', setHH);
}
// 표 제목줄을 상단 검색영역 바로 아래에 고정 (휴대폰처럼 검색영역이 고정 안 될 때는 화면 맨 위)
function setHH(){
  const h = document.querySelector('header');
  document.documentElement.style.setProperty('--hh', getComputedStyle(h).position === 'sticky' ? h.offsetHeight + 'px' : '0px');
}

function buildFilters(){
  const box = document.getElementById('filters');
  box.innerHTML = FILTERS.map(f => {
    const cnt = {};
    ITEMS.forEach(r => { const v = r[f.k]; const key = v==null||v==='' ? '__none' : v; cnt[key] = (cnt[key]||0)+1; });
    let keys = Object.keys(cnt).filter(k => k !== '__none');
    keys.sort(f.num ? (a,b) => a-b : (a,b) => cnt[b]-cnt[a] || a.localeCompare(b,'ko'));
    if (cnt.__none) keys.push('__none');
    if (f.k === 'status'){   // 생산중단은 기본 숨김 — 직접 고를 때만 보인다
      const live = ITEMS.length - (cnt['생산중단']||0);
      return `<label>${f.label}<select data-f="status"><option value="">생산중 (${live})</option>`
        + (cnt['생산중단'] ? `<option value="생산중단">생산중단 (${cnt['생산중단']})</option>` : '')
        + `<option value="__all">전체 (생산중단 포함, ${ITEMS.length})</option></select></label>`;
    }
    const opts = keys.map(k => `<option value="${esc(k)}">${k==='__none' ? '미기재' : esc(f.fmt ? f.fmt(+k) : k)} (${cnt[k]})</option>`).join('');
    return `<label>${f.label}<select data-f="${f.k}"><option value="">전체</option>${opts}</select></label>`;
  }).join('');
  box.querySelectorAll('select').forEach(s => s.onchange = () => { render(); writeHash(); });
}

function matchTok(r, tok, scope){
  if (isCho(tok)) return r._cho.includes(tok);
  // 중량(500g)·소비기한(270일)은 숫자가 정확히 같아야 일치 (1500g, 10000g 오인 방지)
  let m = tok.match(/^(\d+)g$/);  if (m && scope !== 'ing') return r.weightG === +m[1];
  m = tok.match(/^(\d+)일$/);      if (m && scope !== 'ing') return r.shelfLife === +m[1];
  if (scope === 'code') return r._code.includes(tok);
  if (scope === 'name') return r._name.includes(tok);
  if (scope === 'ing')  return r._ing.includes(tok);
  return r._code.includes(tok) || r._name.includes(tok) || r._ing.includes(tok) || r._extra.includes(tok);
}

function current(){
  const q = document.getElementById('q').value.trim();
  const scope = document.getElementById('scope').value;
  const toks = q.split(/\s+/).filter(Boolean);
  const inc = toks.filter(t => !t.startsWith('-')).map(normToken).filter(Boolean);
  const exc = toks.filter(t => t.startsWith('-') && t.length > 1).map(t => normToken(t.slice(1)));
  const fsel = {};
  document.querySelectorAll('#filters select').forEach(s => { s.classList.toggle('on', !!s.value); if (s.value) fsel[s.dataset.f] = s.value; });
  if (!fsel.status) fsel.status = '__live';
  let list = ITEMS.filter(r => {
    for (const k in fsel){
      if (k === 'status'){
        if (fsel.status === '__all') continue;
        if (fsel.status === '__live'){ if (r.status === '생산중단') return false; continue; }
      }
      const v = r[k]; const key = v==null||v==='' ? '__none' : String(v); if (key !== fsel[k]) return false;
    }
    if (!inc.every(t => matchTok(r, t, scope))) return false;
    if (exc.some(t => matchTok(r, t, scope))) return false;
    // 제외 검색(-대두 등)은 원재료·알레르기 정보가 없는 제품을 결과에서 뺀다 — "정보 없음"을 "안 들어감"으로 오인 방지
    if (exc.length && !r.ingredients && !r.allergy && !r.mainIng) return false;
    return true;
  });
  const key = sortK === 'name' ? '_sortName' : sortK;
  list.sort((a,b) => {
    let x = a[key], y = b[key];
    if (x==null || x==='') return 1; if (y==null || y==='') return -1;
    const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'ko', {numeric:true});
    return sortDesc ? -c : c;
  });
  return {list, inc: inc.filter(t => !isCho(t))};
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(text, toks){
  text = String(text||''); if (!toks.length || !text) return esc(text);
  // 띄어쓰기 무시 매칭을 원문 위치로 되돌려 강조
  const chars = [...text], map = [], flat = [];
  chars.forEach((c,i) => { if (!/[\s,·\/]/.test(c)){ flat.push(c.toLowerCase()); map.push(i); } });
  const f = flat.join(''), on = new Array(chars.length).fill(false);
  toks.forEach(t => { let p = f.indexOf(t); while (p >= 0){ for (let j=p;j<p+t.length;j++) on[map[j]] = true; p = f.indexOf(t, p+1); } });
  let out = '', open = false;
  chars.forEach((c,i) => { if (on[i] && !open){ out += '<mark>'; open = true; } if (!on[i] && open && !/[\s,·\/]/.test(c)){ out += '</mark>'; open = false; } out += esc(c); });
  return out + (open ? '</mark>' : '');
}
function snippet(r, toks){
  if (!toks.length) return '';
  const src = r.ingredients || r.mainIng || '';
  const f = norm(src);
  const hit = toks.find(t => f.includes(t) && !r._name.includes(t) && !r._code.includes(t) && !norm(r.mainIng).includes(t));
  if (!hit) return '';
  // 일치 위치 주변만 잘라 보여줌
  let pos = 0, cnt = 0; const target = f.indexOf(hit);
  for (; pos < src.length && cnt < target; pos++) if (!/[\s,·\/]/.test(src[pos])) cnt++;
  const a = Math.max(0, pos-30), b = Math.min(src.length, pos+hit.length+50);
  return (a>0?'…':'') + hl(src.slice(a,b), toks) + (b<src.length?'…':'');
}

function render(){
  const {list, inc} = current(); window._list = list;
  document.getElementById('cnt').textContent = list.length;
  document.getElementById('empty').classList.toggle('hidden', list.length > 0);
  document.querySelectorAll('th[data-k]').forEach(th => { th.classList.toggle('sorted', th.dataset.k===sortK); th.classList.toggle('desc', th.dataset.k===sortK && sortDesc); });
  const MAX = 400;
  document.getElementById('rows').innerHTML = list.slice(0, MAX).map((r,i) => {
    const sn = snippet(r, inc);
    return `<tr data-i="${ITEMS.indexOf(r)}">
      <td class="code">${hl(r.code, inc)}</td>
      <td><div class="nm" title="${esc(r.erpName || r.labelName)}">${hl(r.erpName || r.labelName, inc)}</div></td>
      <td class="c-main">${r.mainIng ? hl(r.mainIng, inc) : '<span class="tip">미기재</span>'}${sn ? `<div class="ing">원재료: ${sn}</div>` : ''}</td>
      <td><span class="pill t-${esc(r.temp)}">${esc(r.temp)}</span></td>
      <td class="c-type">${esc(r.erpGroup)}</td>
      <td class="c-wt num">${fmtW(r.weightG)}</td>
      <td class="c-life num">${r.shelfLife!=null ? r.shelfLife+'일' : '<span class="tip">미기재</span>'}</td>
      <td class="c-st"><span class="pill st-${esc(r.status)}">${esc(r.status)}</span></td>
      <td class="c-ls"><span class="pill ls-${esc(r.labelStatus)}">${esc(r.labelStatus)}</span></td>
      <td class="c-fac">${esc(r.factory)}</td></tr>`;
  }).join('') + (list.length > MAX ? `<tr><td colspan="10" class="tip">상위 ${MAX}개만 표시 — 조건을 더 좁혀 주세요</td></tr>` : '');
}

/* 상세 */
document.getElementById('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  openDetail(ITEMS[+tr.dataset.i]);
});
function openDetail(r){
  const row = (k,v) => v ? `<tr><th>${k}</th><td>${esc(v)}</td></tr>` : '';
  document.getElementById('dlgBody').innerHTML = `
    <button class="close" onclick="closeDetail()">×</button>
    <h2>${esc(r.erpName || r.labelName)}</h2>
    <div class="meta">코드 <b>${esc(r.code)}</b> · ERP ${esc(r.erpName)}</div>
    <div class="pills">
      <span class="pill t-${esc(r.temp)}">${esc(r.temp)}</span>
      <span class="pill st-${esc(r.status)}">${esc(r.status)}</span>
      <span class="pill ls-${esc(r.labelStatus)}">표시사항 ${esc(r.labelStatus)}</span>
      <span class="pill">${esc(r.factory)}</span>
      <span class="pill">${esc(r.erpGroup)}</span>
    </div>
    <h3>표시사항</h3>
    <table class="lbl">
      ${row('제품명', r.labelName)}${row('식품유형', r.foodType)}${row('내용량', r.content)}${row('입수량(외박스)', r.pack)}
      ${row('주원료 함량', r.mainIng)}${row('원재료명 및 함량', r.ingredients)}${row('알레르기', r.allergy)}
      ${row('보관방법', r.storage)}${row('소비기한', r.shelfLife!=null ? r.shelfLife+'일' : '')}${row('제조원', r.maker)}
      ${row('품목보고번호', r.reportNo)}${row('포장재질', r.packMat)}
    </table>
    <h3>ERP 정보</h3>
    <table class="lbl">
      ${row('품목명', r.erpName)}${row('품목약칭', r.shortName)}${row('제품군 / 제품군류', [r.group, r.erpGroup].filter(Boolean).join(' / '))}
      ${row('보관구분', r.temp)}${row('소비기한', r.shelfLife!=null ? r.shelfLife+'일' : '')}${row('단위중량', r.weightG!=null ? r.weightG+' g' : '')}
      ${row('공장구분', r.factory)}${row('매입거래처', r.supplier)}${row('생산구분', r.status)}
    </table>`;
  document.getElementById('dlg').classList.remove('hidden');
}
function closeDetail(){ document.getElementById('dlg').classList.add('hidden'); }
document.getElementById('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDetail(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

/* 정렬 · 입력 · 주소 공유 */
document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
  if (sortK === th.dataset.k) sortDesc = !sortDesc; else { sortK = th.dataset.k; sortDesc = false; }
  render();
});
let tmr; document.getElementById('q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { render(); writeHash(); }, 120); });
document.getElementById('scope').onchange = () => { render(); writeHash(); };
document.getElementById('qClear').onclick = () => { document.getElementById('q').value=''; render(); writeHash(); document.getElementById('q').focus(); };
document.getElementById('reset').onclick = () => {
  document.getElementById('q').value=''; document.getElementById('scope').value='all';
  document.querySelectorAll('#filters select').forEach(s => s.value=''); render(); writeHash();
};
function writeHash(){
  const p = new URLSearchParams(); const q = document.getElementById('q').value.trim(), sc = document.getElementById('scope').value;
  if (q) p.set('q', q); if (sc !== 'all') p.set('in', sc);
  document.querySelectorAll('#filters select').forEach(s => { if (s.value) p.set(s.dataset.f, s.value); });
  history.replaceState(null, '', p.toString() ? '#'+p.toString() : location.pathname + location.search);
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  document.getElementById('q').value = p.get('q') || '';
  if (p.get('in')) document.getElementById('scope').value = p.get('in');
  document.querySelectorAll('#filters select').forEach(s => { if (p.get(s.dataset.f)) s.value = p.get(s.dataset.f); });
}

window.addEventListener('hashchange', () => {
  if (!ITEMS.length) return;
  document.getElementById('scope').value = 'all';
  document.querySelectorAll('#filters select').forEach(s => s.value = '');
  readHash(); render();
});

/* CSV */
document.getElementById('csv').onclick = () => {
  const H = [['코드','code'],['ERP 제품명','erpName'],['표시 제품명','labelName'],['품온','temp'],['제품유형','type'],['식품유형','foodType'],
    ['단위중량(g)','weightG'],['내용량','content'],['입수량(외박스)','pack'],['소비기한(일)','shelfLife'],['생산구분','status'],
    ['표시사항 상태','labelStatus'],['공장구분','factory'],['매입거래처','supplier'],['품목약칭','shortName'],['제품군','group'],['제품군류','erpGroup'],
    ['주원료 함량','mainIng'],['원재료명 및 함량','ingredients'],['알레르기','allergy'],
    ['보관방법(표시사항)','storage'],['제조원','maker'],['품목보고번호','reportNo'],['포장재질','packMat']];
  const q = v => { v = v==null ? '' : String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = '﻿' + [H.map(h=>h[0]).join(',')].concat(window._list.map(r => H.map(h => q(r[h[1]])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = '제품표시사항_검색결과_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
};

boot();
